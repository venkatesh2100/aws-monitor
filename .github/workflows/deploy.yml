name: CI/CD


on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 862172028477.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_REPOSITORY: venky2100/fastapi-app
  WEB_REPOSITORY: venky2100/react-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build FastAPI Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG" \
            ./backend

      - name: Build React Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG" \
            ./web

      - name: Push FastAPI image
        run: |
          docker push "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"

      - name: Push React image
        run: |
          docker push "$ECR_REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REGISTRY: ${{ env.ECR_REGISTRY }}
          BACKEND_REPOSITORY: ${{ env.BACKEND_REPOSITORY }}
          WEB_REPOSITORY: ${{ env.WEB_REPOSITORY }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REGISTRY,BACKEND_REPOSITORY,WEB_REPOSITORY,IMAGE_TAG

          script: |
            set -e

            cd /home/ubuntu/
            export ECR_REGISTRY=${{ env.ECR_REGISTRY }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export BACKEND_REPOSITORY=${{env.BACKEND_REPOSITORY}}
            export WEB_REPOSITORY=${{env.WEB_REPOSITORY}}

            
            echo "Deploying image: $IMAGE_TAG"

            aws ecr get-login-password \
              --region "$AWS_REGION" | \
              docker login \
              --username AWS \
              --password-stdin "$ECR_REGISTRY"

            docker pull \
              "$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"

            docker pull \
              "$ECR_REGISTRY/$WEB_REPOSITORY:$IMAGE_TAG"

            docker compose up -d

            docker image prune -af
